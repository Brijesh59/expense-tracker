<svg
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <title>Luma layered app icon</title>
  <desc>
    Editable SVG version of the Luma cat icon. Background, cat body, left eye,
    and right eye are separate named layers for animation.
  </desc>

  <defs>
    <linearGradient id="luma-bg-gradient" x1="110" y1="0" x2="914" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A1DB3" />
      <stop offset="0.45" stop-color="#4420C0" />
      <stop offset="1" stop-color="#301797" />
    </linearGradient>
    <radialGradient id="luma-bg-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(520 505) rotate(90) scale(560 500)">
      <stop offset="0" stop-color="#4B24C8" stop-opacity="0.45" />
      <stop offset="0.62" stop-color="#3A1DB3" stop-opacity="0.16" />
      <stop offset="1" stop-color="#2E168F" stop-opacity="0" />
    </radialGradient>
    <filter id="cat-soft-edge" x="118" y="142" width="820" height="902" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.06 0 0 0 0 0.02 0 0 0 0 0.18 0 0 0 0.18 0" result="shadow" />
      <feMerge>
        <feMergeNode in="shadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g id="icon-background">
    <rect width="1024" height="1024" fill="url(#luma-bg-gradient)" />
    <rect width="1024" height="1024" fill="url(#luma-bg-glow)" />
  </g>

  <g id="cat" filter="url(#cat-soft-edge)">
    <path
      id="cat-body"
      d="M137 1024V704C137 657 145 615 161 581C145 509 134 443 134 363C134 245 160 183 202 166C263 141 336 208 410 329C462 318 529 312 592 318C615 225 639 178 673 166C730 145 788 212 833 322C859 386 874 465 875 535C900 586 909 660 922 731C934 794 907 856 847 904C776 961 672 990 533 998C458 1002 374 1002 280 1001C230 1001 182 1002 137 1024Z"
      fill="#F5E12A"
    />
  </g>

  <g id="eyes" fill="url(#luma-bg-gradient)">
    <ellipse
      id="left-eye"
      cx="534"
      cy="685"
      rx="81"
      ry="120"
    />
    <ellipse
      id="right-eye"
      cx="777"
      cy="685"
      rx="70"
      ry="111"
    />
  </g>
</svg>
